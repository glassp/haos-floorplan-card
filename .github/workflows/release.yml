name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach floorplan-card.js to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync version with the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"${VERSION}\";/" src/floorplan-card.ts
      - run: npm run build
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/floorplan-card.js
